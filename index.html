<div id="intro"><div class="em" aria-hidden="true">🎈</div><h2 id="iname"></h2><p>Sube a nuestro globo, nos vamos volando juntos.</p><button id="go" class="b" type="button">Despegar</button></div>

<script>

/* ---------- Mensajes ---------- */
var mTxt='',mT0=0;

/* ---------- Monitos ---------- */
function chibi(x,neckY,r,boy,dir,lean,k,blink){
  c.save();c.translate(x,neckY);c.scale(dir,1);c.rotate(lean);

  if(boy){c.beginPath();c.ellipse(r*.15,-r*2.05,r*.2,r*.32,.5,0,6.2832);c.fill()}
  var ey=-r*.85,happy=blink||k>.5;c.lineCap='round';
  [.4,-.3].forEach(function(m){var ex=r*m;
    if(happy){c.strokeStyle='#2a1530';c.lineWidth=r*.08;c.beginPath();c.arc(ex,ey+r*.06,r*.13,Math.PI*1.1,Math.PI*1.9);c.stroke()}
    else{c.fillStyle='#2a1530';c.beginPath();c.ellipse(ex,ey,r*.11,r*.16,0,0,6.2832);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(ex+r*.04,ey-r*.06,r*.045,0,6.2832);c.fill()}});
  c.fillStyle='rgba(255,100,140,'+(.5+.3*k)+')';c.beginPath();c.ellipse(r*.68,-r*.55,r*.2,r*.12,0,0,6.2832);c.fill();c.beginPath();c.ellipse(-r*.5,-r*.55,r*.2,r*.12,0,0,6.2832);c.fill();

  c.restore()}
function arm(x1,y1,x2,y2,col,r){c.strokeStyle=col;c.lineWidth=r*.45;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.fillStyle='#ffdcc4';c.beginPath();c.arc(x2,y2,r*.22,0,6.2832);c.fill()}
var bx,by,S,s;

  var g=c.createLinearGradient(0,-s,0,s);g.addColorStop(0,'#ff9db8');g.addColorStop(.55,'#ff4e8e');g.addColorStop(1,'#c21e67');
  c.fillStyle=g;heart(0,0,s);c.fill();c.save();heart(0,0,s);c.clip();c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=2;
  [.28,.62,1].forEach(function(m){c.beginPath();c.ellipse(0,0,s*m,s*1.1,0,0,6.2832);c.stroke()});
  c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.ellipse(-s*.5,-s*.35,s*.12,s*.28,.7,0,6.2832);c.fill();c.restore();

/* ---------- Escena ---------- */
function frame(now){

  var ph=reduce?0:(time*.0125)%1,kk=Math.floor(ph*4),f=ss(ph*4-kk),A=K[kk],B=K[(kk+1)%4],top=mix(A[0],B[0],f),bot=mix(A[1],B[1],f),dk=A[2]+(B[2]-A[2])*f;

  c.fillStyle='#fff';var si;
  for(si=0;si<stars.length;si++){var st=stars[si];c.globalAlpha=Math.max(0,dk-.3)*1.4*(.4+.6*Math.abs(Math.sin(time+st.p)));c.fillRect(st.x*W,st.y*H,st.r,st.r)}
  c.globalAlpha=1;
  if(!reduce&&dk>.7&&Math.random()<.006)shoot.push({x:Math.random()*W*.7,y:Math.random()*H*.3,l:1});
  for(si=shoot.length-1;si>=0;si--){var q=shoot[si];q.x+=11;q.y+=4.5;q.l-=.02;if(q.l<=0){shoot.splice(si,1);continue}var gr=c.createLinearGradient(q.x,q.y,q.x-120,q.y-48);gr.addColorStop(0,'rgba(255,255,255,'+q.l+')');gr.addColorStop(1,'rgba(255,255,255,0)');c.strokeStyle=gr;c.lineWidth=1.6;c.beginPath();c.moveTo(q.x,q.y);c.lineTo(q.x-120,q.y-48);c.stroke()}
  /* sol / luna */
  var ox=W*(.82-ph*.5),oy=H*(.2+.05*Math.sin(ph*6.28)),or=Math.min(W,H)*.07,oc=mix([255,214,150],[255,246,224],ss((dk-.4)*1.7));
  c.globalCompositeOperation='lighter';var og=c.createRadialGradient(ox,oy,or*.6,ox,oy,or*4);og.addColorStop(0,rg(oc,.45));og.addColorStop(1,rg(oc,0));c.fillStyle=og;c.fillRect(ox-or*4,oy-or*4,or*8,or*8);c.globalCompositeOperation='source-over';
  c.fillStyle=rg(oc,1);c.beginPath();c.arc(ox,oy,or,0,6.2832);c.fill();
  var sp=1+(reduce?0:(1-ss((time-t0)/5))*4);
  /* globos lejanos */
  smalls.forEach(function(m){m.x-=dt*.006*sp;if(m.x<-.1)m.x=1.1;var x=m.x*W,y=m.y*H+Math.sin(time*.7+m.p)*8,r=Math.min(W,H)*.03*m.s*2;c.globalAlpha=.55;c.fillStyle='hsl('+m.h+',70%,'+(65-dk*25)+'%)';c.beginPath();c.ellipse(x,y,r*.8,r,0,0,6.2832);c.fill();c.fillStyle='#6a4a3a';c.fillRect(x-r*.2,y+r*1.3,r*.4,r*.35);c.strokeStyle='rgba(80,50,40,.6)';c.beginPath();c.moveTo(x-r*.3,y+r*.9);c.lineTo(x-r*.2,y+r*1.3);c.moveTo(x+r*.3,y+r*.9);c.lineTo(x+r*.2,y+r*1.3);c.stroke();c.globalAlpha=1});

    for(var x=0;x<=W+8;x+=8){var sc=x+time*(j?14:7)*(reduce?0:1)*sp;c.lineTo(x,H*m[0]-H*m[1]*(.5+.28*Math.sin(sc*.006*m[2])+.22*Math.sin(sc*.017*m[2]+j)))}c.lineTo(W,H);c.fill();

/* ---------- Toques ---------- */
var started=false;

  if(!started)return;var x=e.clientX,y=e.clientY;
  for(var j=0;j<clouds.length;j++){var k=clouds[j];if(k.n>=0&&Math.hypot(x-k.sx,y-k.sy)<k.sr){say(CONFIG.notas[k.n%CONFIG.notas.length]);burst(k.sx,k.sy,7);return}}
  if(Math.abs(x-bx)<s*1.1&&y>by+s*.9&&y<by+s*2.4){kissT=time;say('Muac ♥ Te quiero mucho');burst(x,y,8);return}
  burst(x,y,6)});

/* ---------- Música ---------- */
var ac,mt,on=false,step=0,master;
var CH=[[261.6,329.6,392],[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7]];
function note(f,t,d,v,ty){var o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.1)}
function play(){var t=ac.currentTime+.05,ch=CH[(step/8|0)%4],j=step%8;if(j===0)ch.forEach(function(f){note(f/2,t,4,.05,'sine')});note(ch[[0,1,2,1,0,2,1,2][j]]*2,t,1.2,.06,'triangle');step++}
function music(){
  try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();var lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;var dl=ac.createDelay();dl.delayTime.value=.38;var fb=ac.createGain();fb.gain.value=.4;master.connect(lp);lp.connect(ac.destination);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(ac.destination)}
    on=!on;$('music').setAttribute('aria-pressed',on);$('music').textContent=on?'♪ Pausar':'♪ Música';
    if(on){ac.resume();play();mt=setInterval(play,520)}else{clearInterval(mt);ac.suspend()}}catch(e){}}
$('music').addEventListener('click',music);
$('go').addEventListener('click',function(){$('intro').classList.add('off');$('music').classList.add('on');if(!on)music();started=true;t0=time;say(CONFIG.saludo)});
})();
</script>
